name: release

# Tags are created manually; robots never create them. This workflow only turns
# an existing v* tag into a GitHub Release with auto-generated notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # creating a release writes to the repository

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # Full history so the generated notes can diff against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
