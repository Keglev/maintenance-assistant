name: frontend-e2e

# =============================================================================
# frontend-e2e.yml - The functional end-to-end suite (Playwright) against the
# full stack.
#
# Usage: a reusable workflow, run as the `e2e` job of backend-ci and frontend-ci
# behind a relevance gate (.github/scripts/e2e-relevant.sh). Each CI's
# aggregator, the required check, fails when this fails, and the deploys start
# on those CI runs, so the suite gates both merge and deploy (ADR-007).
# Concurrency is the caller's: a reusable workflow runs inside the calling run.
#
# Produces: the Playwright report as an artifact when a test fails.
#
# FAILURE MODE: red when the stack cannot be provisioned (e2e-stack action) or a
# test fails. No credential is written in this file: the database and the
# Keycloak admin get a random value at run time, masked and passed through the
# environment, so a reader or a secret scanner never meets a literal password.
# =============================================================================

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Postgres, Keycloak, the provider stub and a backend with a seeded, indexed corpus. Shared
      # with the visual job rather than copied — see the action for why that distinction matters
      # here specifically.
      - uses: ./.github/actions/e2e-stack

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        working-directory: frontend
        env:
          # The whole suite, INCLUDING the re-index test — it is only gated on a model being
          # available, and there is one listening on 8099. It was skipped in every CI run until now.
          E2E_LLM: '1'
        run: npm run e2e

      # The trace of a failed test is what makes a red run diagnosable without reproducing it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true

      - name: Keycloak theme errors on failure
        if: failure()
        run: docker logs keycloak 2>&1 | grep -i -e freemarker -e theme || echo "no theme errors"
