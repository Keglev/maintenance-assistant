<!-- ONE element, whose TEXT changes and whose node does not.
     That is what makes "announce on change only" true: a polite live region speaks when its
     content changes, so a poll that returns the same state re-renders the same string and says
     nothing. Rebuilding the element per state — an @switch, or three elements behind @if — would
     re-announce every sixty seconds, which is how a status line becomes something to turn off. -->
<p
  class="health"
  role="status"
  aria-live="polite"
  data-testid="health-dot"
  [attr.data-state]="state()"
>
  <span class="health-dot health-{{ state() }}" aria-hidden="true"></span>
  <span class="health-label">{{ label() }}</span>
</p>
