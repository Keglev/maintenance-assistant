name: deploy-tier

# =============================================================================
# deploy-tier.yml - Builds, scans and publishes one tier's image, then rolls it
# out to the Hetzner host and verifies the live service by commit.
#
# Usage: a reusable workflow, called by backend-deploy.yml and frontend-deploy.yml
# (one job each, `uses: ./.github/workflows/deploy-tier.yml`). The caller decides
# WHEN to deploy (after its CI on main, or by hand); this file holds HOW, once.
# A called workflow sees the caller's event, so github.event.workflow_run below is
# the CI run that started the caller.
#
# Produces: ghcr.io/<repository>/<tier> tagged latest and sha-<commit>, a CycloneDX
# SBOM artifact, and the tier's line in .env.prod on the host naming that tag.
#
# FAILURE MODE: red when the image scan finds a fixable CRITICAL or HIGH issue (no
# push happens), when the rollout fails on the host, or when the public URL does
# not serve the deployed commit afterwards. Green and skipped rollout when the
# live commit already contains this one (an older deploy that started late).
# =============================================================================

on:
  workflow_call:
    inputs:
      tier:
        description: Image name under the repository and compose service (backend or frontend).
        required: true
        type: string
      commit-url:
        description: Public URL answering JSON with the commit the live tier was built from.
        required: true
        type: string
      maven-build-context:
        description: Seed the image build with the runner's Maven repository (backend).
        required: false
        type: boolean
        default: false
      app-url:
        description: When set, the application shell and the edge security headers are checked there.
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

permissions:
  contents: read
  packages: write

# No workflow-level concurrency group on purpose: builds of different commits
# may run side by side, and cancelling a superseded run would also cancel the
# rollout waiting inside it. Only the deploy job below is serialised.

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # checkout v7 refuses to check out fork pull-request code under workflow_run
      # unless allow-unsafe-pr-checkout is set. That is wanted here: this job builds
      # and pushes an image, so it must never build a fork's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build exactly the commit CI validated, not whatever main points at now.
          # A manual dispatch has no such commit and uses the ref it was started on.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # The runner's Maven repository (same cache as the build job) seeds the image's
      # build stage through the "m2" build context, so go-offline fetches only the delta.
      - if: inputs.maven-build-context
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Locate the Maven repository for the build context
        if: inputs.maven-build-context
        run: mkdir -p "$HOME/.m2/repository" && echo "BUILD_CONTEXTS=m2=$HOME/.m2/repository" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The image is scanned BEFORE the registry login below, so no registry
      # credential exists in the job while the scanner runs (image-scan.sh says
      # why that matters). The push build further down reuses these layers
      # from the cache.
      - name: Build the image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.tier }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ inputs.tier }}:scan
          cache-from: type=gha
      - name: Scan the image
        env:
          TIER: ${{ inputs.tier }}
        run: bash .github/scripts/image-scan.sh "$TIER:scan" "$RUNNER_TEMP/$TIER-sbom.cdx.json"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.tier }}-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ inputs.tier }}-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.tier }}
          # Tagged with the CI-validated commit that was built. type=sha reads github.sha,
          # which under workflow_run is main's head when the run starts: after two quick
          # merges a newer commit, so the deploy job asked for a tag never pushed.
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.tier }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          # The commit the image reports (backend: /api/health, frontend:
          # /build-info.json), so a deploy can verify WHICH build answers. Same
          # resolution as the checkout ref: the CI-validated commit, or the dispatch ref's.
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          # amd64 only: production is x86_64, so an arm64 image would have no consumer.
          # One would need a native arm64 runner: `npm ci` dies under qemu-emulated arm64
          # with "Illegal instruction". See docs/decisions.md, Costs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to Hetzner
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # One group for both tiers on purpose: both run `docker compose up` against
    # the same host, and two of those at once race over the same containers and
    # the same Docker daemon. cancel-in-progress is false because a cancelled
    # rollout leaves the stack half-updated; a queued deploy is always better
    # than an interrupted one.
    concurrency:
      group: hetzner-deploy
      cancel-in-progress: false
      # Every deploy waits its turn; without it a newer pending deploy replaces
      # an older one. GitHub does not promise the start order of waiting runs,
      # which is why the rollout checks the served commit before and after.
      queue: max

    env:
      TIER: ${{ inputs.tier }}
      COMMIT_URL: ${{ inputs.commit-url }}
      APP_URL: ${{ inputs.app-url }}
      # The commit CI validated, deployed by its own image tag. Empty on a manual
      # redeploy, which rolls out whatever image .env.prod already names.
      COMMIT: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The scripts below, and the history the order check reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      # Skips the rollout, green, when the live commit already contains this one
      # (an older deploy that started late); deploys in every other case.
      - name: Check the deploy order against the live commit
        id: order
        if: env.COMMIT != ''
        run: bash .github/scripts/deploy-commit-check.sh stale "$COMMIT_URL" "$COMMIT"

      # The key is written from a secret through the environment rather than
      # interpolated into the script, so it never becomes part of the command
      # line. `set -x` is deliberately absent from every step in this job.
      - name: Install the deploy key
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned: the known_hosts line comes from a secret, read
          # on the server itself, never fetched over the network at deploy time.
          [ -n "$DEPLOY_HOST_KEY" ] || { echo "::error::DEPLOY_HOST_KEY is not set"; exit 1; }
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # deploy-rollout.sh runs on the host: it records the image in .env.prod
      # (guarded edit, .bak kept), pulls, recreates the service and reports the
      # image now configured. The commit is read back from that report, so a
      # manual redeploy is verified against what .env.prod actually names.
      - name: Roll out the service
        id: rollout
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          image=${COMMIT:+ghcr.io/${GITHUB_REPOSITORY,,}/$TIER:sha-$COMMIT}
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- $TIER ${TIER^^}_IMAGE $image" < .github/scripts/deploy-rollout.sh | tee "$RUNNER_TEMP/rollout.log"
          deployed=$(sed -n 's/^deployed-image=//p' "$RUNNER_TEMP/rollout.log")
          if [[ "$deployed" == *:sha-* ]]; then echo "commit=${deployed##*:sha-}" >> "$GITHUB_OUTPUT"; fi

      # From the runner over the public internet, so DNS, TLS and the reverse
      # proxy are part of what passes. Only an image tagged by commit can be
      # checked by commit; an image named :latest gets a notice instead.
      - name: Verify the live service serves the deployed commit
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOYED: ${{ steps.rollout.outputs.commit }}
        run: |
          if [ -z "$DEPLOYED" ]; then echo "::notice::.env.prod names no commit tag; commit not verified"; exit 0; fi
          bash .github/scripts/deploy-commit-check.sh served "$COMMIT_URL" "$DEPLOYED"

      # The build id proves which bundle nginx serves; the application shell in
      # the root page proves that the bundle actually loads behind the proxy.
      - name: Verify the live application shell
        if: steps.order.outputs.stale != 'true' && inputs.app-url != ''
        run: |
          curl -fsS --max-time 10 --retry 5 --retry-delay 6 --retry-all-errors -o "$RUNNER_TEMP/index.html" "$APP_URL"
          grep -q '<app-root' "$RUNNER_TEMP/index.html" || { echo "::error::no application shell at $APP_URL"; exit 1; }

      # Set by Caddy at the edge, so checked where a visitor receives them.
      - name: Verify the public security headers
        if: steps.order.outputs.stale != 'true' && inputs.app-url != ''
        run: bash .github/scripts/check-security-headers.sh "$APP_URL"

      - name: Remove the deploy key
        # Runs even when a step above failed: the key must not survive the job on
        # a self-hosted or reused runner.
        if: always()
        run: rm -f ~/.ssh/deploy_key
