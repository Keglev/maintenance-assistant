<!--
  Fallback layout, used when the site is built without the remote theme
  (for example on a local `jekyll serve` with no network). Intentionally plain:
  readable typography, no assets, no JavaScript.
-->
<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.65;
      }
      header a { text-decoration: none; font-weight: 600; }
      h1, h2, h3 { line-height: 1.25; }
      table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
      th, td { border: 1px solid #8884; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
      pre { overflow-x: auto; padding: 0.75rem; background: #8881; border-radius: 6px; }
      code { font-size: 0.9em; }
      img, svg { max-width: 100%; height: auto; }
      footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #8884; font-size: 0.9em; opacity: 0.8; }
    </style>
  </head>
  <body>
    <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
    <main>{{ content }}</main>
    <footer>{{ site.footer_content }}</footer>
  </body>
</html>
