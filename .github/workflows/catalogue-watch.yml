name: catalogue-watch

# =============================================================================
# catalogue-watch.yml - checks that the IONOS AI Model Hub still lists the four model
# ids this project depends on, and turns a disappearance into a red run instead of an
# incident. ADR-002, revision 2026-08-27, section 5 records the decision.
#
# Usage: runs by itself monthly; workflow_dispatch for the day somebody wants to know now.
# Produces: the catalogue size and the count of *-migration aliases (a change in that
# count hints that the catalogue moved); the full served catalogue only on a red run.
#
# WHY ABSENCE IS THE SIGNAL. /v1/models entries carry only created, id, object and
# owned_by: no lifecycle field, no deprecation flag, no retirement date, and `created`
# is the response timestamp. A model going away shows only as an id no longer listed
# (measured; ADR-002, revision 2026-08-27, section 5).
#
# WHY THE FALLBACK IS CHECKED HERE. The monthly live provider tests call only the
# configured chat and embedding models. openai/gpt-oss-120b, ADR-002's documented
# fallback, and Qwen/Qwen3.5-397B-A17B, the second model ADR-002 records as measured
# (note of 2026-11-19), are watched by this job alone.
#
# WHY MONTHLY. Retirements are announced weeks ahead, by email or on the provider's
# models page ("Scheduled to Retire On" / "Retired On" / "Alternative"). Monthly is
# early enough to act on and rare enough that a red run means something.
#
# FAILURE MODE. Red with "no longer listed": read
# https://docs.ionos.com/cloud/ai/ai-model-hub/models and open a ledger row; production
# is not down, the backend keeps calling its configured model until that call fails.
# Red with "HTTP <code>": the catalogue could not be read, so nothing was checked.
# Green: all four ids are listed. Nothing pages anyone.
#
# SECRET: LLM_API_KEY, shared with the backend. It reaches curl through the step
# environment, never interpolated into the command line, so it cannot appear in the
# rendered script; `set +x` keeps the shell from echoing the request.
# =============================================================================

on:
  schedule:
    # 06:17 UTC on the 1st. The odd minute is deliberate: GitHub's scheduler queues
    # heavily on the hour, and this job has no reason to compete for that slot.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read # reads nothing in the repository; this is the least privilege there is

concurrency:
  group: catalogue-watch
  cancel-in-progress: true

jobs:
  models:
    name: the four ids this project depends on
    runs-on: ubuntu-24.04

    # No checkout: the ids are written into the script below, so the repository is
    # never read, and the workflow pins no third-party action at all.
    steps:
      - name: Check the IONOS catalogue
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set +x
          set -euo pipefail

          BASE="https://openai.inference.de-txl.ionos.com/v1"

          code=$(curl -sS -o models.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${LLM_API_KEY}" "${BASE}/models")

          if [ "$code" != "200" ]; then
            echo "::error::IONOS /v1/models answered HTTP ${code}, so the catalogue could not be read."
            echo "This is not the same finding as a missing model: the check did not run."
            exit 1
          fi

          jq -r '.data[].id' models.json | sort > ids.txt
          total=$(wc -l < ids.txt)

          # ADR-002 caveat 2: the *-migration ids are deprecated aliases and must be
          # ignored by any model-selection logic. Counted rather than checked, as
          # information — a change in this number is a hint that the catalogue moved.
          migration=$(grep -c -- '-migration$' ids.txt || true)

          missing=""
          for id in \
            "meta-llama/Llama-3.3-70B-Instruct" \
            "BAAI/bge-m3" \
            "openai/gpt-oss-120b" \
            "Qwen/Qwen3.5-397B-A17B"
          do
            if ! grep -qxF "$id" ids.txt; then
              missing="${missing}${id}\n"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::A model this project depends on is no longer listed:"
            printf "%b" "$missing"
            echo "Read https://docs.ionos.com/cloud/ai/ai-model-hub/models and open a ledger row."
            echo "--- the catalogue as served (${total} ids) ---"
            cat ids.txt
            exit 1
          fi

          echo "All four ids are listed."
          echo "  meta-llama/Llama-3.3-70B-Instruct  (chat, application.yml default)"
          echo "  BAAI/bge-m3                        (embedding, vector(1024))"
          echo "  openai/gpt-oss-120b                (documented fallback, ADR-002 revision 2026-08-27)"
          echo "  Qwen/Qwen3.5-397B-A17B             (measured second model, ADR-002 note 2026-11-19)"
          echo "catalogue size: ${total} ids, of which ${migration} are *-migration aliases (caveat 2)"
