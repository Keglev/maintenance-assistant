name: frontend-deploy

# Publishes the frontend image to GHCR after frontend-ci succeeded on main.
# See backend-deploy.yml for why this uses workflow_run rather than `on: push`.
on:
  workflow_run:
    workflows: [frontend-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  image:
    name: build and push image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO(Phase 4): deploy to the Hetzner CAX host once the VPS exists.
      # Same shape as backend-deploy.yml — pull and restart over SSH. Blocked on
      # the VPS, a domain with TLS, and a reverse proxy in front of this container.
