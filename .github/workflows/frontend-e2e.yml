name: frontend-e2e

# The rendered half of the test stack (ADR-007, revised 2026-11-13). A REUSABLE WORKFLOW: it has no
# triggers of its own and runs only as the `e2e` job inside backend-ci and frontend-ci, behind a
# relevance gate (.github/scripts/e2e-relevant.sh). That is what makes it a merge gate — the required
# check is each CI's aggregator job, which fails when this fails and passes when the gate skipped it —
# and what makes it a deploy gate, because the deploys trigger on the CI runs that now contain it.
#
# It lived here as a standalone workflow with its own pull_request/push triggers until 2026-11-13,
# reporting under an advisory check named `e2e` that gated nothing: the deploys waited only for the
# CI workflows, and on one main commit the frontend deploy finished three minutes before this suite
# did. ADR-007's promotion bar (ten consecutive green non-Dependabot pull-request runs) was measured
# met at eleven on 2026-11-12, so the advisory era ended by decision, not drift — the dated revision
# in ADR-007 records it.
#
# Concurrency is the caller's: a reusable workflow runs inside the calling run, so backend-ci's and
# frontend-ci's groups already serialise it per ref.
#
# NO CREDENTIALS ARE WRITTEN DOWN IN THIS FILE. The database and the Keycloak admin get a random
# value generated at run time, masked in the log and passed through the environment. The containers
# live for one job and are reachable from nothing else, so any value would have been harmless — but
# a literal password in a versioned file is a pattern a reader cannot distinguish from a real leak at
# a glance, and neither can a secret scanner. This costs one `openssl rand` and removes the question.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Postgres, Keycloak, the provider stub and a backend with a seeded, indexed corpus. Shared
      # with the visual job rather than copied — see the action for why that distinction matters
      # here specifically.
      - uses: ./.github/actions/e2e-stack

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        working-directory: frontend
        env:
          # The whole suite, INCLUDING the re-index test — it is only gated on a model being
          # available, and there is one listening on 8099. It was skipped in every CI run until now.
          E2E_LLM: '1'
        run: npm run e2e

      # The trace of a failed test is what makes a red run diagnosable without reproducing it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true

      - name: Keycloak theme errors on failure
        if: failure()
        run: docker logs keycloak 2>&1 | grep -i -e freemarker -e theme || echo "no theme errors"
