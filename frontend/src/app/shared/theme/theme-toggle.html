<!-- Icons only, and therefore aria-label and title on every button rather than as an afterthought:
     with the text gone they are the ONLY name this control has. The group carries its own label so a
     screen reader says what the two are for before reading them out, and title gives a sighted user
     the same wording on hover. The SVGs are inline and aria-hidden — no icon font, no third-party
     set, nothing the CSP would have to allow.

     Pressed tracks the theme actually on screen, not the stored choice: with no choice stored the
     operating system decides, and a control with neither half pressed would look broken. -->
<div class="theme-switch" role="group" [attr.aria-label]="t().theme.label" data-testid="theme-toggle">
  <button
    type="button"
    data-testid="theme-light"
    [class.active]="resolved() === 'light'"
    [attr.aria-pressed]="resolved() === 'light'"
    [attr.aria-label]="t().theme.light"
    [title]="t().theme.light"
    (click)="use('light')"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4.2" />
      <path
        d="M12 2.6v2.4M12 19v2.4M4.2 12H1.8M22.2 12h-2.4M6.3 6.3L4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7"
      />
    </svg>
  </button>
  <button
    type="button"
    data-testid="theme-dark"
    [class.active]="resolved() === 'dark'"
    [attr.aria-pressed]="resolved() === 'dark'"
    [attr.aria-label]="t().theme.dark"
    [title]="t().theme.dark"
    (click)="use('dark')"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z" />
    </svg>
  </button>
</div>
