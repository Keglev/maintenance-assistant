name: docs-pr-check

# Gives documentation pull requests a check of their own.
#
# The required branch-protection check is a *name*, `build-and-test`, not a workflow: a PR with no
# job reporting under that name can never merge. Without this workflow, the only way to give a docs
# PR that name would be to let the backend test suite run on it — so changing a Markdown file would
# build and test a Spring Boot application, which proves nothing about the change and fails for
# reasons that have nothing to do with it. This runs the docs checks instead, under the same
# required name, so a docs PR is gated by something that can actually be wrong about it.
#
# The paths below and backend-ci.yml's pull_request paths-ignore are maintained as a pair. Every
# content path in this list is ignored there, and everything else falls through to the backend job.
# A path that ended up in neither would produce a PR with no `build-and-test` check at all, which is
# unmergeable — see the comment on that trigger.
#
# This workflow's own file is deliberately NOT ignored by backend-ci.yml. Editing the docs gate
# should run both checks, because getting it wrong is how the repository loses its ability to merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Same job id as backend-ci.yml and frontend-ci.yml on purpose: the required branch-protection
    # check matches this name, so whichever side a PR touches, a job with the required name reports
    # on it. A PR touching both docs and backend gets two checks under this name, and both must
    # pass. Do not add a `name:` key — it would override the id and hide the required check.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The diagram sources are versioned but their SVGs are not, so a broken .mmd only surfaces
      # when something renders it. docs.yml renders them while publishing; this catches a syntax
      # error on the PR instead of on main, after the site has already failed to build.
      - name: Render mermaid diagrams
        run: node docs/scripts/generate-diagrams.mjs

      # Renders again with nothing stale to do. The script re-renders only sources newer than their
      # SVG, so a second pass proves it is idempotent and that --check agrees with what it just
      # wrote — the mode docs.yml and any future gate rely on.
      - name: Verify diagrams are up to date
        run: node docs/scripts/generate-diagrams.mjs --check

      # Pandoc is the only toolchain the site build needs that the runner lacks. Redocly is not
      # installed: a PR has no OpenAPI artifact, so build-openapi-docs.sh skips, and lychee excludes
      # the API path for exactly that reason.
      - name: Install Pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y pandoc

      # The same script docs.yml publishes with, so this gate cannot pass on a site that the
      # publishing build would fail to produce. Keep the Node version in step with that workflow.
      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      # Every page addresses the site as /maintenance-assistant/..., because that is the prefix it
      # is served under once deployed to the project page. lychee resolves an absolute link by
      # prefixing --root-dir to it, so the site is staged under a directory of exactly that name and
      # --root-dir points at its parent; /maintenance-assistant/x.html then resolves to
      # target/link-check/maintenance-assistant/x.html.
      #
      # THE TRAP, and why the staging matters: a page linking out of the site with ../.. resolves
      # ABOVE the staged directory, into --root-dir's parent. Check the same tree in place in the
      # repository instead and that link silently "works", because the real backend/, docker/ and
      # .github/ directories happen to sit exactly where it points. That is how a broken
      # ../../docker/ link passed locally and failed here. Always reproduce a failure against this
      # staged copy, never against the working tree — and never silence an escaping link with a
      # lychee exclusion: a page that means to reference repository source uses an absolute GitHub
      # URL, which `offline = true` skips as external.
      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r target/docs target/link-check/maintenance-assistant

      # The gate. Nothing is uploaded or deployed from a PR run — the question this job answers is
      # only whether the site still builds and its internal links still resolve.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/maintenance-assistant/**/*.html"
