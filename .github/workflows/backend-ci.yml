name: backend-ci

# Runs on every pull request not claimed by another gate, and on main after merge.
# `mvn verify` covers unit tests, integration tests, the JaCoCo report, THE JACOCO
# COVERAGE GATE and the OpenAPI export — no database or Keycloak is needed, because
# the test profile disables datasource and Flyway auto-configuration and no token is
# validated.
#
# The gate is named here because this comment is where someone looks to find out what
# this job can fail on, and since #83 it can fail on coverage: instructions, branches
# and methods each below 0.85 at BUNDLE level halt the build. The floors and the
# reasoning behind them live in backend/pom.xml beside the rule itself.
#
# ONE FAILURE MODE WORTH KNOWING BEFORE IT HAPPENS: this project's coverage depends on
# the Testcontainers integration tests, so a runner that cannot start Docker fails the
# COVERAGE rule rather than reporting a Docker problem. Measured with -DskipITs while
# arming the gate: 44 / 60 / 41. If that shape appears, the ITs did not run.
on:
  pull_request:
    branches: [main]
    # This is the catch-all gate. A path may be ignored here ONLY if another
    # workflow gives that PR a check named build-and-test — the required one. A
    # path ignored by every workflow leaves its PRs with no such check and
    # permanently blocked from merging, so this list is not a matter of taste.
    #
    # Two workflows earn entries. frontend/** is covered by frontend-ci.yml. The
    # docs paths are covered by docs-pr-check.yml; they are that workflow's
    # CONTENT trigger paths and must stay in step with them. Its gate-adjacent
    # paths — its own file and .github/scripts/docs/** — are deliberately absent
    # below, so those run both gates (see that workflow's header). Everything else
    # falls through to this job — including README.md, .gitignore, AI-USAGE.md,
    # LICENSE and docker/**, which deliberately stay here rather than joining the
    # docs list: they are outside docs/, so the docs build never reads them and
    # would gate them on nothing.
    #
    # frontend-ci.yml's and docs-pr-check.yml's own files are deliberately absent
    # below, so editing a gate runs the backend suite as well as that gate.
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    # Unlike the pull_request trigger above, this list is NOT a partition. A push
    # run exists to produce artifacts and to trigger backend-deploy.yml, so it
    # fires only when the backend actually changed. Widening it to a catch-all
    # would publish a new backend image for a README typo.
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The job id IS the status-check name GitHub reports, and branch protection
    # requires exactly one name: build-and-test. frontend-ci.yml and
    # docs-pr-check.yml use the same id on purpose, so whichever side a PR
    # touches, a job with the required name reports on it. Do not add a `name:`
    # key here — it would override the id and the required check would never
    # appear, blocking every merge.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: error
          retention-days: 7

      # The OpenAPI document written by OpenApiSpecIT. Published to gh-pages by
      # docs.yml, because reachable API docs are a hard requirement for the demo.
      - name: Upload OpenAPI spec
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-api-docs
          path: backend/target/openapi
          if-no-files-found: error
          retention-days: 7

      # Test reports are useful precisely when the build is red.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
