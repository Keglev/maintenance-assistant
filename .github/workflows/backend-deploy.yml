name: backend-deploy

# =============================================================================
# backend-deploy.yml - Deploys the backend after backend-ci succeeded on main.
#
# Usage: starts by itself when backend-ci completes on main (workflow_run), or by
# hand (workflow_dispatch) to redeploy whatever tag .env.prod names, without a
# code change: the button after editing .env.prod on the server, or when a
# container has to be recreated. workflow_run rather than `on: push` is
# deliberate: it is the only trigger that means "after CI success"; a push
# trigger would race the CI run and could publish an image whose tests never ran.
#
# Produces: what deploy-tier.yml produces for the backend; this file decides only
# when, the build, scan, rollout and verification live there once for both tiers.
#
# FAILURE MODE: skipped when backend-ci failed or was cancelled; otherwise red or
# green as deploy-tier.yml describes. The live commit is read from /api/health.
# =============================================================================

on:
  workflow_run:
    workflows: [backend-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Only a successful CI run on a push to main of this repository deploys: the
    # branches filter matches a branch NAME, which a fork can share. A manual
    # dispatch has no workflow_run to inspect and is admitted on the event name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/deploy-tier.yml
    with:
      tier: backend
      commit-url: https://maintenance.smartsupply.com.de/api/health
      maven-build-context: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
