# Local development defaults, matching the compose stack in docker/.
# Every value is overridable by environment variable, which is how the container is configured.
spring:
  application:
    name: maintenance-assistant

  datasource:
    # Host-side default. Inside the compose network the host is `postgres`, not `localhost`;
    # if 5432 is taken on your machine, start compose with POSTGRES_PORT=5433 and adjust here.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maintenance}
    username: ${SPRING_DATASOURCE_USERNAME:maintenance}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-locally}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Stated rather than left to the default: the seed migration contains German umlauts,
    # and a JVM whose default charset is not UTF-8 would otherwise mangle them silently.
    encoding: UTF-8

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/maintenance}

  servlet:
    multipart:
      # STATED, not inherited. Boot's implicit default is 1 MB, which was never a decision
      # anyone made — and a limit nobody chose is a limit nobody can defend. A protocol is
      # a page of text (the whole 150-document corpus is 27,713 tokens), so 256 KiB is
      # roughly 50x the largest realistic one and still 100x below anything that could
      # hurt this host. The request cap is double the file cap: the same file plus a
      # handful of short form fields, and no more.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:256KB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:512KB}

  web:
    error:
      # Stack traces are never part of an HTTP response. Boot 4 moved these out of
      # server.error.* with no deprecation alias, so under the old key they were not
      # read at all -- the values happened to match the defaults, which is why nothing
      # looked wrong. Stated here they are enforced rather than coincidental.
      include-stacktrace: never
      include-message: never

maintenance:
  files:
    # Original protocol documents. The container mounts the Docker volume at
    # /var/lib/maintenance/files and sets this accordingly; the local default is a
    # git-ignored directory next to the build output so a laptop needs no setup.
    base-path: ${MAINTENANCE_FILES_PATH:./data/protocol-files}
  corpus-seed:
    # Off unless asked for: seeding is idempotent, but it is still a deliberate act.
    # Enable with CORPUS_SEED_ENABLED=true.
    enabled: ${CORPUS_SEED_ENABLED:false}
    resource: classpath:corpus/protocols.ndjson

  ingestion:
    # 256 KiB of DECODED text, matching the multipart cap above. The whole 150-protocol
    # corpus is 27,713 tokens, so one protocol is a few KB: this is ~50x the largest
    # realistic protocol and still far below anything that could hurt. A shift protocol
    # is a page of text; anything larger is a PDF someone renamed, and rejecting it
    # before it reaches the volume is cheaper than after.
    max-upload-bytes: ${INGESTION_MAX_UPLOAD_BYTES:262144}
    # NFR-7, burst case. Per user per minute, in memory — the cross-instance backstop is
    # the daily embedding budget in Postgres, not this bucket.
    uploads-per-minute: ${INGESTION_UPLOADS_PER_MINUTE:10}
    # Also the provider concurrency: one embedding call in flight per worker. Small
    # deliberately — 150 documents is not a stream, and four parallel callers is
    # politeness toward a shared gateway.
    workers: ${INGESTION_WORKERS:4}
    queue-capacity: ${INGESTION_QUEUE_CAPACITY:200}
    # Off by default: indexing costs money, and a restart for an unrelated reason
    # must not start spending. Protocols already INDEXED are never selected.
    backlog-on-startup: ${INGESTION_BACKLOG_ON_STARTUP:false}
    backlog-batch-size: ${INGESTION_BACKLOG_BATCH_SIZE:200}

  embedding:
    # IONOS AI Model Hub, primary provider per ADR-002. Nebius Token Factory is the
    # documented fallback and is a base-url + model change, not a code change — both
    # speak the same OpenAI-compatible API.
    base-url: ${LLM_BASE_URL:https://openai.inference.de-txl.ionos.com/v1}
    api-key: ${LLM_API_KEY:}
    # Ignore the *-migration aliases in the IONOS catalogue (ADR-002).
    model: ${LLM_EMBEDDING_MODEL:BAAI/bge-m3}
    # NOT a free parameter: chunk.embedding is vector(1024) because bge-m3 is 1024.
    # Asserted on every response so a model swap fails loudly instead of corrupting
    # retrieval quietly.
    dimensions: 1024
    batch-size: ${LLM_EMBEDDING_BATCH_SIZE:32}
    max-retries: 3
    retry-backoff: 2s
    timeout: 60s
    # NFR-7. The provider offers no hard spending cap (ADR-002 residual risk), so this
    # counter is the actual ceiling. 500 calls x 32 texts is far more than a full
    # re-index of the corpus, and at bge-m3 pricing a day at the limit is cents.
    daily-call-budget: ${LLM_DAILY_CALL_BUDGET:500}

  chat:
    # Same provider and same gateway as the embedding block above, and deliberately
    # its own configuration: the two calls have different timeouts, different failure
    # costs and different ceilings, and a provider swap could move one without the
    # other. base-url includes /v1 for the reason ADR-002 records.
    base-url: ${LLM_BASE_URL:https://openai.inference.de-txl.ionos.com/v1}
    api-key: ${LLM_API_KEY:}
    # Llama-3.3-70B for every role — measured, see the ADR-002 note of 2026-08-07.
    # Qwen/Qwen3.5-9B stays a config swap; the client then sends reasoning_effort
    # "none" on its own, or the model spends its whole output budget thinking and
    # returns empty content (ADR-002 caveat 3).
    model: ${LLM_CHAT_MODEL:meta-llama/Llama-3.3-70B-Instruct}
    # NFR-7. MEASURED 2026-08-07 against the production prompts, not carried over from
    # the spike: the spike's longest answer was 195 tokens, but it asked for a one-line
    # refusal where Mode B asks for a troubleshooting list and Mode A for one claim per
    # statement. At 700 the Mode-B demo case hit the cap and came back as truncated JSON.
    # 1200 leaves headroom over the longest observed answer (481 tokens) and is still
    # runaway protection rather than a constraint on answer quality.
    max-tokens: ${LLM_CHAT_MAX_TOKENS:1200}
    # Grounded answering, not writing. 0 is not used because a few providers treat it
    # as "unset"; 0.1 is deterministic enough and unambiguous.
    temperature: 0.1
    # Above NFR-4's 30 s ceiling on purpose: this is the point at which we give up on
    # a request we have already paid for, not the point at which the user gives up.
    timeout: 45s
    max-retries: 1
    retry-backoff: 1s
    # NFR-7's ceiling for the query path, counted in provider calls and surviving a
    # restart. 400 answers a day at Llama-3.3-70B pricing is under EUR 0.35.
    daily-call-budget: ${LLM_CHAT_DAILY_CALL_BUDGET:400}

  duplicates:
    # DUPLICATE DETECTION ON APPROVAL — a WARNING, never a gate. See ADR-006's
    # 2026-08-14 revision and DuplicateSimilarityCalibrationIT, which re-takes every
    # number below against the real provider and the real corpus.
    #
    # NOT the query threshold, and the two are not comparable. ADR-002's 0.55 is
    # question-to-chunk; this is document-to-document between two texts of the same
    # genre, on the same machine, from the same template, both carrying the chunker's
    # "PR-03 · E-47 · …" context prefix. The MEAN over all 1,393 same-machine pairs in
    # the corpus is 0.5547 — i.e. the average pair already sits at the query path's
    # threshold. Carrying 0.55 over here would flag half the corpus.
    #
    # MEASURED 2026-08-14, protocol centroids, cosine, bge-m3, 165-protocol corpus:
    #   mean over all 1,393 same-machine pairs     0.5547
    #   the E-47 four against each other           0.7594 - 0.8329   all legitimate
    #   HIGHEST LEGITIMATE PAIR IN THE CORPUS      0.9151            PR-07, the 4000 h
    #     and 8000 h services — one template, one technician, different work
    #   a re-narration of one incident by a
    #     second person (the REALISTIC duplicate)  0.9305
    #   a verbatim re-file under a new title       0.9778  (not 1.0: the chunker
    #     prefixes every chunk with "PR-03 · E-47 · <title>", and the copy has a
    #     different title — the one thing a re-filer always changes)
    #
    # THE FINDING, AND IT IS NOT WHAT THIS WORK SET OUT TO CONFIRM: the E-47 four are
    # the tightest FAULT cluster and they are NOT the constraint — they clear this
    # number by 0.09. The constraint is scheduled maintenance, which shares a template
    # and a vocabulary and scores higher than any two E-47 protocols do. So the usable
    # window is 0.9151 .. 0.9305, and it is 0.0154 wide.
    #
    # 0.92 sits in it: 0.0049 above the highest legitimate pair, 0.0105 below the
    # realistic duplicate. Low in the window on purpose — a false positive costs one
    # card in a dialog an approver dismisses, a false negative costs the warning
    # entirely, and this feature WARNS AND NEVER BLOCKS, which is exactly what makes a
    # narrow window survivable. If it blocked, this margin would not be shippable.
    similarity-threshold: ${DUPLICATE_SIMILARITY_THRESHOLD:0.92}
    # Three: a prompt to compare, not a report to read. An approver handed ten links
    # opens none. The COUNT of everything above the threshold is reported separately,
    # so a long tail is visible rather than silently cut to three.
    max-candidates: ${DUPLICATE_MAX_CANDIDATES:3}

  query:
    # The Mode A / Mode B switch (NFR-2). MEASURED against the real corpus on
    # 2026-08-07, not inherited from the 10-protocol spike: the E-47 demo scores
    # 0.695 and the DE->EN demo 0.577, both of which must be Mode A, while the
    # deliberate Mode-B gap scores 0.502. 0.55 sits in that gap with margin on
    # both sides. ADR-002's 0.583 would have refused the cross-language demo.
    # bge-m3-specific: any embedding-model change invalidates it.
    similarity-threshold: ${QUERY_SIMILARITY_THRESHOLD:0.55}
    top-k: ${QUERY_TOP_K:5}
    # NFR-7. Per user per minute, keyed by the token subject. Generous for a person
    # asking questions, useless for a script.
    rate-limit-per-minute: ${QUERY_RATE_LIMIT_PER_MINUTE:10}
    # Long enough that a shift handover asking the same thing twice costs one answer,
    # short enough that a newly uploaded protocol shows up while the shift is running.
    cache-ttl: ${QUERY_CACHE_TTL:10m}
    cache-max-entries: ${QUERY_CACHE_MAX_ENTRIES:500}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow: /api/health is the public probe, the rest stays closed.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # /swagger-ui rather than springdoc's /swagger-ui.html default: it is the path a reader types
    # and the path the README publishes, so it is the one that has to resolve. The webjar's own
    # resources live under /swagger-ui/**, which does not cover the bare path; the other spellings
    # (/swagger-ui/ and the former default) are redirected by ApiDocsRoutingConfig.
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    # Bracketed because the key contains dots: unescaped, relaxed binding reads it as
    # nested maps rather than one logger name.
    "[org.springframework.security]": ${LOG_LEVEL_SECURITY:INFO}
