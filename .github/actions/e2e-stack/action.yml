name: e2e stack
description: >
  Provisions everything the rendered test suites need — Postgres, Keycloak with the real realm export
  and the real login theme, the LLM provider stub, and the backend with a seeded and indexed corpus —
  and waits for each of them on a condition rather than a sleep.

# SHARED BY THE FUNCTIONAL AND THE VISUAL JOB, and shared rather than copied on purpose. PR #51
# closed two defects that were the same bug twice, both caused by a helper being duplicated instead
# of extracted: a machine picker fixed in one file and left broken in the other, and a cleanup sweep
# that silently did nothing in both. Ninety lines of stack setup in two jobs is that mistake waiting
# to happen at a larger size — the two would drift, and the job that drifted would be the one nobody
# was looking at.
#
# Each job that uses this gets its OWN runner and therefore its own database, which is the isolation
# ADR-007 asks for in CI.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    # Both containers are started here rather than as `services:`, because a service container is
    # created before any step runs and therefore cannot be given a value a step generated. Keycloak
    # needed a plain `docker run` anyway: it mounts the realm export and the theme directory, which
    # a service container cannot do.
    # A DATABASE PER RUN, and this is where CI differs from a laptop on purpose.
    #
    # ADR-007 accepts a dirty local database: a developer's stack is long-lived, the suite cleans
    # up after itself through the application, and the alternative was inventing a second
    # deployment topology. CI has neither of those constraints and one extra hazard — a reused
    # database there would make a green run depend on the order the runs happened in, which is the
    # one failure mode a build server must not have. It was not hypothetical: seven leftover
    # protocols accumulated locally while this suite was being made to work, and the eighth run
    # then failed because a previous run's data was being retrieved as if it were corpus.
    #
    # The container is created here, destroyed with the runner, and never sees a second run.
    - name: Start Postgres and Keycloak
      shell: bash
      run: |
        PG_SECRET="$(openssl rand -hex 24)"
        KC_SECRET="$(openssl rand -hex 24)"
        echo "::add-mask::$PG_SECRET"
        echo "::add-mask::$KC_SECRET"
        echo "PG_SECRET=$PG_SECRET" >> "$GITHUB_ENV"

        docker run -d --name postgres \
          -p 5432:5432 \
          -e POSTGRES_DB=maintenance \
          -e POSTGRES_USER=maintenance \
          -e POSTGRES_PASSWORD="$PG_SECRET" \
          -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
          pgvector/pgvector:0.8.6-pg17

        # The same image and the same realm export the developer stack uses, so the users, roles
        # and the login theme under test are the ones that ship.
        docker run -d --name keycloak \
          -p 8081:8080 \
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_SECRET" \
          -e KC_HEALTH_ENABLED=true \
          -e WA_HOME_URL=http://localhost:4200 \
          -e WA_SHOW_DEMO_ACCOUNTS=true \
          -v "${{ github.workspace }}/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro" \
          -v "${{ github.workspace }}/docker/keycloak/themes/wartungsassistent:/opt/keycloak/themes/wartungsassistent:ro" \
          quay.io/keycloak/keycloak:26.7 start-dev --import-realm

    - name: Wait for Postgres
      shell: bash
      run: |
        # Conditions, not sleeps — the same discipline the suite itself follows.
        for i in $(seq 1 40); do
          docker exec postgres pg_isready -U maintenance -d maintenance >/dev/null 2>&1 && break
          sleep 3
        done
        docker exec postgres pg_isready -U maintenance -d maintenance || {
          echo "::error::Postgres never became ready"; docker logs postgres | tail -50; exit 1; }

    # The provider stub — see frontend/e2e/provider-stub/server.mjs for what it does and does not
    # fake. It exists so `reindex.e2e.ts` can run at all: that test needs an embedding and an
    # answer, and making CI depend on a funded key would mean the most valuable test in the suite
    # never runs. Zero dependencies, so there is nothing to install.
    - name: Start the LLM provider stub
      working-directory: frontend
      shell: bash
      run: |
        nohup node e2e/provider-stub/server.mjs --port 8099 > "$RUNNER_TEMP/stub.log" 2>&1 &
        for i in $(seq 1 20); do
          curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1 && break
          sleep 1
        done
        curl -fsS http://127.0.0.1:8099/health || {
          echo "::error::the provider stub never came up"; cat "$RUNNER_TEMP/stub.log"; exit 1; }

    - name: Start the backend
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/maintenance
        SPRING_DATASOURCE_USERNAME: maintenance
        KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/maintenance
        # Seeds the 150-protocol corpus...
        CORPUS_SEED_ENABLED: 'true'
        # ...and INDEXES it. Without this the seed lands 150 protocols as RECEIVED with zero
        # chunks and retrieval has nothing to retrieve — which is how CI ran until now, and it
        # went green because no test until `reindex.e2e.ts` needed a chunk to exist. The flag is
        # off by default for a good reason (indexing costs money and a restart must not start
        # spending); here the provider is a stub two lines up, so it costs nothing.
        INGESTION_BACKLOG_ON_STARTUP: 'true'
        # Everything the model does is faked; everything the application does is not.
        LLM_BASE_URL: http://127.0.0.1:8099/v1
        LLM_API_KEY: stub-no-key-needed
        # THE THRESHOLD IS A PROPERTY OF THE EMBEDDING MODEL, not a constant of the application —
        # application.yml says so in as many words ("bge-m3-specific: any embedding-model change
        # invalidates it"). The stub is a different embedding model, so it gets its own value.
        # Measured against the stub's vectors: a question scores 0.42-0.45 against the protocol it
        # is about and 0.10-0.13 against an unrelated one, so 0.30 sits in that gap with margin on
        # both sides and the Mode A / Mode B distinction survives intact.
        QUERY_SIMILARITY_THRESHOLD: '0.30'
      working-directory: backend
      shell: bash
      run: |
        # Exported here rather than declared above, so this file contains no line that pairs a
        # password key with a value.
        export SPRING_DATASOURCE_PASSWORD="$PG_SECRET"
        # `spring-boot:run` rather than package-then-java-jar: the repackage step produces more
        # than one artefact in target/ and a glob that picks the wrong one fails in a way that
        # reads like an application error. This is also exactly how the stack is started locally.
        nohup mvn -B -DskipTests spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &
        echo "backend starting"

    - name: Wait for Keycloak and the backend
      shell: bash
      run: |
        for i in $(seq 1 60); do
          curl -fsS http://localhost:8081/realms/maintenance >/dev/null 2>&1 && break
          sleep 3
        done
        curl -fsS http://localhost:8081/realms/maintenance >/dev/null || {
          echo "::error::Keycloak never became ready"; docker logs keycloak | tail -50; exit 1; }

        for i in $(seq 1 60); do
          curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && break
          sleep 3
        done
        curl -fsS http://localhost:8080/api/health || {
          echo "::error::the backend never became ready"; tail -80 "$RUNNER_TEMP/backend.log"; exit 1; }

    - name: Wait for the corpus to finish indexing
      shell: bash
      run: |
        # Retrieval has nothing to retrieve until this finishes, and it is asynchronous by design
        # (the seed writes rows, a pipeline embeds them). Against the stub it takes seconds.
        #
        # THE CONDITION IS POSITIVE, AND THAT IS A CORRECTION. This waited for
        # "no protocol is in RECEIVED" — which is also true of an EMPTY database, so the wait
        # sailed straight through before the seed had inserted anything and reported success. The
        # first visual run caught it: the moderation table was screenshotted while its rows still
        # read "Accepted, indexing" instead of "Searchable", and the failure arrived dressed as a
        # layout regression. A guard that cannot tell "finished" from "not started" is not a guard.
        #
        # AND IT FAILS LOUDLY. The old loop simply ran out of iterations and let the job continue,
        # so a stack that was not ready produced a confusing failure two steps later instead of an
        # accurate one here.
        expected=150
        for i in $(seq 1 90); do
          indexed=$(docker exec postgres psql -U maintenance -d maintenance -t -A \
            -c "select count(*) from protocol where status = 'INDEXED';" 2>/dev/null || echo 0)
          [ "$indexed" = "$expected" ] && break
          sleep 5
        done

        docker exec postgres psql -U maintenance -d maintenance -t -A \
          -c "select status, count(*) from protocol group by status;"
        docker exec postgres psql -U maintenance -d maintenance -t -A \
          -c "select count(*) as chunks from chunk;"

        indexed=$(docker exec postgres psql -U maintenance -d maintenance -t -A \
          -c "select count(*) from protocol where status = 'INDEXED';" 2>/dev/null || echo 0)
        if [ "$indexed" != "$expected" ]; then
          echo "::error::the corpus never finished indexing ($indexed of $expected). Every test" \
               "below would be measuring a half-built fixture."
          tail -60 "$RUNNER_TEMP/backend.log" || true
          tail -20 "$RUNNER_TEMP/stub.log" || true
          exit 1
        fi

