name: frontend-e2e

# The rendered half of the test stack (ADR-007). Runs on pull requests that touch the frontend, the
# backend or the Keycloak theme, because all three can break a flow this suite asserts.
#
# THIS JOB IS DELIBERATELY NOT NAMED `build-and-test`. That name is the one required status check in
# branch protection, and every workflow that uses it is promising "if this is red, the PR is not
# mergeable". This job cannot make that promise yet: it provisions Postgres, Keycloak and a Spring
# Boot backend inside the runner, and an infrastructure flake here would block merges for a reason
# that has nothing to do with the change under review.
#
# So it reports under its own name, `e2e`, and a failure is ADVISORY TODAY. That is stated out loud
# in ADR-007 rather than left to be discovered from this file, together with the condition for
# changing it: make it required once it has run green on ten consecutive pull requests without an
# infrastructure-caused failure. Leaving it advisory forever would repeat, in a new form, exactly the
# mistake that produced the defects it exists to catch.
#
# NO CREDENTIALS ARE WRITTEN DOWN IN THIS FILE. The database and the Keycloak admin get a random
# value generated at run time, masked in the log and passed through the environment. The containers
# live for one job and are reachable from nothing else, so any value would have been harmless — but
# a literal password in a versioned file is a pattern a reader cannot distinguish from a real leak at
# a glance, and neither can a secret scanner. This costs one `openssl rand` and removes the question.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker/keycloak/**'
      - '.github/workflows/frontend-e2e.yml'
      - '.github/actions/e2e-stack/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker/keycloak/**'
      - '.github/workflows/frontend-e2e.yml'
      - '.github/actions/e2e-stack/**'

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # Postgres, Keycloak, the provider stub and a backend with a seeded, indexed corpus. Shared
      # with the visual job rather than copied — see the action for why that distinction matters
      # here specifically.
      - uses: ./.github/actions/e2e-stack

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        working-directory: frontend
        env:
          # The whole suite, INCLUDING the re-index test — it is only gated on a model being
          # available, and there is one listening on 8099. It was skipped in every CI run until now.
          E2E_LLM: '1'
        run: npm run e2e

      # The trace of a failed test is what makes a red run diagnosable without reproducing it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true

      - name: Keycloak theme errors on failure
        if: failure()
        run: docker logs keycloak 2>&1 | grep -i -e freemarker -e theme || echo "no theme errors"
