@if (open()) {
  <!-- The backdrop closes on click, like every modal a user has met before. The panel stops the
       click from reaching it, so a click inside does not dismiss what it lands on. -->
  <div
    class="backdrop"
    [attr.data-testid]="testId() + '-backdrop'"
    (click)="close()"
    (keydown)="onKeydown($event)"
  >
    <!-- tabindex="-1" makes the panel a focus TARGET without making it a tab STOP. It is where
         focus lands when a dialog opens with no usable control of its own — the case that broke
         Esc in the protocol viewer, whose first button is disabled until its document arrives. -->
    <div
      class="panel"
      #panel
      tabindex="-1"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.data-testid]="testId() + '-dialog'"
      (click)="$event.stopPropagation()"
    >
      <div class="panel-head">
        <div class="panel-heading">
          <h2 class="panel-title" [id]="titleId">{{ title() }}</h2>
          <!-- A second line for whatever identifies this particular dialog — the protocol viewer
               names the machine here, so the reader knows which document they opened. -->
          <ng-content select="[dialogSubtitle]" />
        </div>
        <div class="panel-actions">
          <ng-content select="[dialogActions]" />
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            [attr.data-testid]="testId() + '-close'"
            [attr.aria-label]="t().common.close"
            (click)="close()"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
            {{ t().common.close }}
          </button>
        </div>
      </div>

      <div class="panel-body">
        <ng-content />
      </div>
    </div>
  </div>
}
