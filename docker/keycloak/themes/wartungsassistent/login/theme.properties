# Wartungsassistent login theme — Keycloak 26.7 (image quay.io/keycloak/keycloak:26.7,
# themes jar org.keycloak.keycloak-themes-26.7.1).
#
# EXTENDS keycloak.v2, the default login theme of this major. Everything the parent gives —
# PatternFly v5, the responsive login card, the password-visibility toggle, the locale picker,
# the dark-mode switch below — is inherited. This theme adds one stylesheet and one template.
parent=keycloak.v2
import=common/keycloak

# APPENDED, not replaced. The parent declares `styles=css/styles.css`; dropping that would take the
# whole login card with it and leave unstyled PatternFly markup. Ours loads last so it wins on
# equal specificity — everywhere except the realm heading, which the parent's own styles.css pins
# with !important. That one exception is argued at the top of wartungsassistent.css.
styles=css/styles.css css/wartungsassistent.css

# The parent already ships dark mode: template.ftl emits <meta name="color-scheme"> and a script
# that toggles `pf-v5-theme-dark` from `prefers-color-scheme`. Kept ON so our palette hangs off the
# mechanism the parent maintains, rather than a second one of ours that would have to be kept in
# step with it. See K1.2 in the PR: the login page follows the OPERATING SYSTEM only.
darkMode=true

# Where "back to the application" points.
#
# From the environment, because there is no single right answer to compile in: the same realm serves
# http://localhost:4200 in development and https://maintenance.smartsupply.com.de in production, and
# a literal here would send a developer to the live site. Empty by default, and the footer renders
# no link at all when it is empty — a back-link to nowhere is worse than none.
waHomeUrl=${env.WA_HOME_URL:}

# Whether to show the demo-account box. Off unless a deployment asks for it: these are published
# credentials by decision (this is a public demo and a working login is the point), but that is a
# property of THIS deployment and not something a theme should assert on its own.
waShowDemoAccounts=${env.WA_SHOW_DEMO_ACCOUNTS:false}
