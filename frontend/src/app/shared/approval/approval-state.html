<!-- One element per state rather than one element with two classes: the icon differs, and a shared
     node with a swapped path is harder to read than two small blocks that each say one thing. -->
@if (approved()) {
  <span class="approval approval-approved" data-testid="approval-state" data-approval="APPROVED">
    <svg class="approval-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="9" />
      <path d="M8 12.4l2.6 2.6L16 9.6" />
    </svg>
    <span class="approval-label">{{ t().approval.approved }}</span>
    <!-- THE ACTOR AND DATE ARE GONE FROM THIS BADGE (2026-08-14), and they were removed rather than
         hidden behind a flag. This component renders in a table cell, a source card and a dialog
         head; the longest of the three — "Freigegeben system:corpus-seed · 12.08.2026" in the
         Verwaltung column — truncated in production and ran under the action buttons. WHO and WHEN
         are provenance, they belong in the record rather than in every list that mentions it, and
         the protocol viewer's history section is where they are now. What this badge says is the
         STATE, in every one of its three homes. -->
  </span>
} @else {
  <span class="approval approval-unapproved" data-testid="approval-state" data-approval="UNAPPROVED">
    <!-- The word is what carries the meaning; the colour and the triangle only make it findable. An
         unapproved protocol is not an error, so this is not the danger red — it is the caution the
         reader is owed before they act on the text. -->
    <svg class="approval-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 3.6L1.8 20.4h20.4z" />
      <path d="M12 9.6v4.6" />
      <circle class="dot" cx="12" cy="17.4" r="1" />
    </svg>
    <span class="approval-label">{{ t().approval.unapproved }}</span>
  </span>
}
