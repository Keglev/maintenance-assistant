name: release

# Tags are created manually; robots never create them. This workflow only turns
# an existing v* tag into a GitHub Release with auto-generated notes, and only
# when the tag equals the version in frontend/package.json and backend/pom.xml
# (release-version-check.sh). A refused tag stays in place without a release:
# delete it, align the versions in a pull request, and tag the merge commit.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # creating a release writes to the repository

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Full history so the generated notes can diff against the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the tag against the code versions
        run: bash .github/scripts/release-version-check.sh "$GITHUB_REF_NAME"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
