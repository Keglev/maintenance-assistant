name: backend-deploy

# Publishes the backend image to GHCR after backend-ci succeeded on main, then
# rolls it out to the Hetzner host.
#
# workflow_run rather than `on: push` is deliberate: it is the only trigger that
# genuinely means "after CI success". A plain push trigger would race the CI run
# and could publish an image whose tests never passed.
#
# workflow_dispatch redeploys whatever tag .env.prod currently names, without a
# code change — the button to reach for after editing .env.prod on the server, or
# when a container has to be recreated.
on:
  workflow_run:
    workflows: [backend-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# No workflow-level concurrency group on purpose: builds of different commits
# may run side by side, and cancelling a superseded run would also cancel the
# rollout waiting inside it. Only the deploy job below is serialised.

jobs:
  image:
    name: build and push image
    # Skips the run when CI failed or was cancelled. A manual dispatch has no
    # workflow_run to inspect, so it is admitted on the event name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      # checkout v7 refuses to check out fork pull-request code under workflow_run
      # unless allow-unsafe-pr-checkout is set. That is wanted here: this job builds
      # and pushes an image, so it must never build a fork's code. Same-repo pushes
      # to main, which is all this trigger accepts, are unaffected.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build exactly the commit CI validated, not whatever main points at now.
          # A manual dispatch has no such commit and uses the ref it was started on.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The image is scanned BEFORE the registry login below, so no registry
      # credential exists in the job while the scanner runs (image-scan.sh says
      # why that matters). The push build further down reuses these layers
      # from the cache.
      - name: Build the image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: backend:scan
          cache-from: type=gha
      - name: Scan the image
        run: bash .github/scripts/image-scan.sh backend:scan "$RUNNER_TEMP/backend-sbom.cdx.json"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90


      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          # The commit baked into build-info.properties and reported by /api/health,
          # so a deploy can verify WHICH build answers. Same resolution as the
          # checkout ref above: the CI-validated commit, or the dispatch ref's.
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          # amd64 only: production is x86_64, so an arm64 image would have no consumer. Adding
          # one takes a native arm64 runner, or docker/setup-qemu-action before buildx plus this
          # line. See docs/decisions.md, Costs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Rollout. Separate from the build so the serialisation below covers only the
  # part that touches the server.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy to Hetzner
    needs: image
    runs-on: ubuntu-24.04

    # Shared with frontend-deploy on purpose: both run `docker compose up` against
    # the same host, and two of those at once race over the same containers and
    # the same Docker daemon. cancel-in-progress is false because a cancelled
    # rollout leaves the stack half-updated — a queued deploy is always better
    # than an interrupted one.
    concurrency:
      group: hetzner-deploy
      cancel-in-progress: false
      # Every deploy waits its turn; without it a newer pending deploy replaces
      # an older one. GitHub does not promise the start order of waiting runs,
      # which is why the rollout checks the served commit before and after.
      queue: max

    env:
      # Public URL, so it is not a secret and stays readable in the log.
      HEALTH_URL: https://maintenance.smartsupply.com.de/api/health
      # The commit CI validated, deployed by its own image tag. Empty on a manual
      # redeploy, which rolls out whatever image .env.prod already names.
      COMMIT: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The scripts below, and the history the order check reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      # Skips the rollout, green, when the live commit already contains this one
      # (an older deploy that started late); deploys in every other case.
      - name: Check the deploy order against the live commit
        id: order
        if: env.COMMIT != ''
        run: bash .github/scripts/deploy-commit-check.sh stale "$HEALTH_URL" "$COMMIT"

      # The key is written from a secret through the environment rather than
      # interpolated into the script, so it never becomes part of the command
      # line. `set -x` is deliberately absent from every step in this job.
      - name: Install the deploy key
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned: the known_hosts line comes from a secret, read
          # on the server itself, never fetched over the network at deploy time.
          [ -n "$DEPLOY_HOST_KEY" ] || { echo "::error::DEPLOY_HOST_KEY is not set"; exit 1; }
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # deploy-rollout.sh runs on the host: it records the image in .env.prod
      # (guarded edit, .bak kept), pulls, recreates the service and reports the
      # image now configured. The commit is read back from that report, so a
      # manual redeploy is verified against what .env.prod actually names.
      - name: Roll out the backend service
        id: rollout
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          image=${COMMIT:+ghcr.io/${GITHUB_REPOSITORY,,}/backend:sha-$COMMIT}
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- backend BACKEND_IMAGE $image" < .github/scripts/deploy-rollout.sh | tee "$RUNNER_TEMP/rollout.log"
          deployed=$(sed -n 's/^deployed-image=//p' "$RUNNER_TEMP/rollout.log")
          if [[ "$deployed" == *:sha-* ]]; then echo "commit=${deployed##*:sha-}" >> "$GITHUB_OUTPUT"; fi

      # From the runner over the public internet, so DNS, TLS and the reverse
      # proxy are part of what passes. Only an image tagged by commit can be
      # checked by commit; an image named :latest gets a notice instead.
      - name: Verify the live backend serves the deployed commit
        if: steps.order.outputs.stale != 'true'
        env:
          DEPLOYED: ${{ steps.rollout.outputs.commit }}
        run: |
          if [ -z "$DEPLOYED" ]; then echo "::notice::.env.prod names no commit tag; commit not verified"; exit 0; fi
          bash .github/scripts/deploy-commit-check.sh served "$HEALTH_URL" "$DEPLOYED"

      - name: Remove the deploy key
        # Runs even when a step above failed: the key must not survive the job on
        # a self-hosted or reused runner.
        if: always()
        run: rm -f ~/.ssh/deploy_key
