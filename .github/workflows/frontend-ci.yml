name: frontend-ci

# Runs on every pull request touching the frontend, and on main after merge.
# Coverage and Compodoc are uploaded only from main, because docs.yml publishes
# those artifacts to gh-pages and a pull request must not be able to publish.
#
# SINCE 2026-11-13 IT CAN ALSO FAIL ON THE E2E SUITE. frontend-e2e.yml runs as a
# job of this workflow behind a relevance gate (.github/scripts/e2e-relevant.sh),
# and the aggregator at the bottom — the job that carries the required check name —
# fails when the suite fails and passes when the gate skipped it. That is also what
# gates the deploy: frontend-deploy triggers on this workflow's conclusion, which
# now includes the suite. ADR-007's dated revision records the promotion.
on:
  pull_request:
    branches: [main]
    # Maintained as a pair with backend-ci.yml's pull_request paths-ignore: every
    # path listed here is ignored there, and everything else falls through to that
    # catch-all job. A path in neither list produces a PR with no build-and-test
    # check at all, which is unmergeable — see the comment on that trigger.
    #
    # This workflow's own file is deliberately NOT ignored by backend-ci.yml.
    # Editing the frontend gate should run both checks, because getting it wrong
    # is how the repository loses its ability to merge.
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # BEFORE the tests on purpose: this is the cheapest check in the job and the one
      # whose failure is fixed by a single command (`npm run format`), so a formatting
      # slip should not cost a full vitest run first. Prettier was a devDependency with
      # a .prettierrc and no script and no step from the start of the project until
      # 2026-08-25 — configured, installed, and never run. The formatting findings the
      # Part 1 survey raised on the moderation view stayed open that whole time because
      # nothing could have caught them.
      - name: Check formatting
        run: npm run format:check

      # vitest in jsdom — no browser, so the runner needs no Chrome and no setup step.
      - name: Test with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Generate API documentation
        run: npm run docs

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/maintenance-assistant-frontend
          if-no-files-found: error
          retention-days: 7

      - name: Upload API documentation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-api-docs
          path: frontend/documentation
          if-no-files-found: error
          retention-days: 7

  # Decides whether this change can affect the rendered suites. Full history,
  # because the script diffs against the merge base.
  e2e-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          # On a pull request, the PR's own base and head; on a push to main, the
          # commits the push moved between.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/e2e-relevant.sh "$BASE" "$HEAD"

  e2e:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    uses: ./.github/workflows/frontend-e2e.yml

  # Same gate, same skip rule: a change that cannot affect the rendered suites
  # skips both of them.
  visual:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    uses: ./.github/workflows/frontend-e2e-visual.yml

  # The job id IS the status-check name GitHub reports, and branch protection
  # requires exactly one name: build-and-test. backend-ci.yml and
  # docs-pr-check.yml use the same id on purpose, so whichever side a PR
  # touches, a job with the required name reports on it. A PR touching both
  # frontend and backend gets two checks under this name, and both must pass.
  # Do not add a `name:` key — it would override the id and hide the required
  # check.
  #
  # if: always(), because a skipped aggregator REPORTS SUCCESS to branch
  # protection — the one outcome this job exists to prevent. It fails when the
  # gate itself failed (a gate that cannot answer must not skip the suites
  # silently), fails when the build or the suite failed, and passes when the
  # gate said the change cannot affect the suite.
  build-and-test:
    needs: [build, e2e-gate, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the gate results
        env:
          BUILD: ${{ needs.build.result }}
          GATE: ${{ needs.e2e-gate.result }}
          E2E: ${{ needs.e2e.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          set -eu
          [ "$GATE" = "success" ] || { echo "::error::the e2e relevance gate did not succeed ($GATE)"; exit 1; }
          [ "$BUILD" = "success" ] || { echo "::error::the frontend build did not succeed ($BUILD)"; exit 1; }
          case "$E2E" in success|skipped) ;; *) echo "::error::the e2e suite did not succeed ($E2E)"; exit 1 ;; esac
          case "$VISUAL" in success|skipped) ;; *) echo "::error::the visual suite did not succeed ($VISUAL)"; exit 1 ;; esac
          echo "frontend build green; e2e: $E2E; visual: $VISUAL"
