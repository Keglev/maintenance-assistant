# Only the keys this theme adds. Everything else — "Passwort", "Anmelden", every error message —
# comes from the parent bundle, which Keycloak ships translated and keeps translated. Overriding a
# key here means owning its translation forever, so nothing is overridden that did not need adding.
#
# UTF-8, and that is not the Java default: a .properties file is ISO-8859-1 per the platform spec,
# but Keycloak reads theme message bundles as UTF-8. The built-in bundle in the themes jar is the
# evidence — it carries a raw "Zurück zur Applikation" — so raw umlauts here are correct and \uXXXX
# escapes would be the thing that renders wrongly.

waBackToHome=Zurück zur Startseite
waDemoHeading=Demo-Zugänge
waDemoIntro=Öffentliche Demo. Passwort für alle Konten:
waDemoOperator=Bediener
waDemoTechniker=Techniker
waDemoSchichtleiter=Schichtleiter
waDemoAdmin=Administrator
