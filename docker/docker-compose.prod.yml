# Production stack for maintenance-assistant.
#
#   cd /opt/maintenance-assistant && docker compose -f docker-compose.prod.yml up -d
#
# Differences from the development stack in docker-compose.yml:
#   - images come from GHCR instead of a local build
#   - Caddy terminates TLS and is the ONLY service with published ports
#   - Keycloak runs in production mode against Postgres, not dev mode on H2
#   - nothing else is reachable from the internet; the compose network is the
#     only way in
#
# Configuration lives in .env.prod, which is never committed — see
# .env.prod.example for the full list.
#
# MEMORY LIMITS: THE TWO JVMs ONLY, and that is the whole rule rather than an
# omission. A runtime that sizes itself as a PERCENTAGE OF VISIBLE RAM will take
# a percentage of the HOST when no cgroup limit exists, and both Java services
# here do exactly that. Nothing else in this stack behaves that way:
#   - postgres  sizes from shared_buffers and leans on the kernel page cache,
#               which a cgroup limit counts as usage; capping it would force
#               premature reclaim on the one container whose failure loses data.
#   - caddy     is Go, 66 MiB measured, with no RAM-proportional sizing — and it
#               is the process that has to survive in order to answer at all.
#   - frontend  is nginx over a static bundle, 4.75 MiB measured.
# Measured 2026-08-27; the arithmetic is on each of the two services below.
#
# `deploy.resources.limits` IS honoured by `docker compose up` from Compose v2
# onward — it is not a Swarm-only key. The host runs Compose v5.4.0.

name: maintenance-assistant

# LOGS OUTLIVE THE CONTAINER, AND THEY ARE BOUNDED. Both halves were bought by an
# incident rather than chosen.
#
# WHY THEY MUST OUTLIVE IT: with no logging options, `docker logs` reads a file the
# daemon deletes with the container. The 2026-08-27 maintenance window ran a
# `compose down`, and the backend logs went with it — taking the A4 and the ADR-008
# no-citation windows, which W-2 had been built to make countable. Part 4's S5 row
# records it. json-file with rotation keeps up to five files per container, so a
# recreate loses nothing that has already been written to disk.
#
# WHY THEY MUST BE BOUNDED: this host is shared with a second project (ADR-012) and
# has 75 GB. An unrotated json-file log is unbounded by default, and the one service
# that would fill it first is the one whose failure loses data. 10m x 5 is 50 MB per
# container, 250 MB for the stack — enough to hold a week of this traffic and small
# enough that it can never be the reason the disk fills.
#
# APPLIED TO ALL FIVE, deliberately: an instrument that is only on some containers
# answers "what happened" for some of an incident.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy and TLS. The only internet-facing container.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.10-alpine
    container_name: maintenance-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing caddy_data means re-issuing
      # every certificate on the next start, which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  # ---------------------------------------------------------------------------
  # Angular client behind nginx. Environment-agnostic image: the deployment
  # supplies config.json, so the same tag runs locally and here.
  # ---------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/keglev/maintenance-assistant/frontend:latest}
    container_name: maintenance-frontend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./frontend-config.json:/usr/share/nginx/html/config.json:ro
    # No ports: reachable only through caddy.

  # ---------------------------------------------------------------------------
  # Spring Boot API. Validates tokens issued by the public Keycloak URL, which
  # is why the issuer is the external hostname and not the container name.
  # ---------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/keglev/maintenance-assistant/backend:latest}
    container_name: maintenance-backend
    restart: unless-stopped
    logging: *default-logging
    # --- MEMORY LIMIT — measured on the CX33, 2026-08-27 ----------------------
    # `docker stats --no-stream` reported 301.9 MiB for this container against a
    # LIMIT of 7.565 GiB, which is the host's own RAM — that is no limit at all,
    # and `docker inspect --format '{{.HostConfig.Memory}}'` returned 0 to say so.
    #
    # WHY A LIMIT NOW. This container runs `java -XX:MaxRAMPercentage=75.0`
    # (read from /proc/1/cmdline), and UseContainerSupport applies that
    # percentage to the CGROUP LIMIT ONLY WHEN ONE EXISTS. With none it applies
    # it to the host, so the measured ceiling today is MaxHeapSize
    # 6,094,323,712 B = 5,812 MiB — one JVM entitled to three quarters of the
    # machine. Keycloak's is 5,424 MiB by the same mechanism. Two JVMs may
    # therefore claim ~11 GiB on a 7.5 GiB host with NO SWAP (`swapon --show`
    # prints nothing), and a THIRD is arriving: inventory-service joins this host
    # as a second compose project. Nothing has broken yet only because neither
    # heap has ever been asked to fill. That is luck, not design.
    #
    # THE NUMBER: 301.9 MiB measured, rounded up to the next 512 MiB (= 512) plus
    # 512 MiB of headroom = 1,024 MiB, raised to the 1.5 GiB floor this stack
    # sets for a Spring Boot service. The limit then feeds back into the heap:
    # 75% of 1,536 MiB = 1,152 MiB, still 3.8x what the whole container uses now.
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Must match the `iss` claim in tokens the browser obtained, so it is the
      # public URL even though the container could reach Keycloak internally.
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/maintenance

      # --- Ingestion ---------------------------------------------------------
      # Where uploaded protocol documents are written. Must match the volume
      # mount below: without it the application falls back to its local-dev
      # default (./data/protocol-files, i.e. /app/data inside the container),
      # so every document would land in the container's writable layer and
      # disappear on the next `compose up -d`. The database would keep rows
      # whose source_file points at nothing.
      MAINTENANCE_FILES_PATH: /var/lib/maintenance/files
      # Loads the synthetic corpus into an empty database. Idempotent, but off
      # unless asked for — see .env.prod.example for the one-time procedure.
      CORPUS_SEED_ENABLED: ${CORPUS_SEED_ENABLED:-false}
      # Indexes everything sitting at RECEIVED on startup. Off by default:
      # indexing spends money at the provider, and a restart for an unrelated
      # reason must not start spending.
      INGESTION_BACKLOG_ON_STARTUP: ${INGESTION_BACKLOG_ON_STARTUP:-false}

      # --- LLM provider (ADR-002) --------------------------------------------
      # NOTE ON THE `:-` DEFAULTS BELOW. Compose substitutes an *empty string*
      # for an unset variable written as ${VAR:-}, and an empty string is a set
      # value. Spring's ${VAR:default} only falls back when the variable is
      # absent entirely, so `${LLM_BASE_URL:-}` did not "leave the default
      # alone" — it overrode a working default with "". Anything with a real
      # default in application.yml therefore repeats that default here.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openai.inference.de-txl.ionos.com/v1}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-BAAI/bge-m3}
      # NFR-7: the provider has no hard spending cap (ADR-002), so this counter
      # is the actual ceiling. Tunable here without rebuilding the image.
      LLM_DAILY_CALL_BUDGET: ${LLM_DAILY_CALL_BUDGET:-500}
      # The chat path arrived in Phase 3, so this now has a real default in
      # application.yml and repeats it here — as ${LLM_CHAT_MODEL:-} it was the
      # same empty-override landmine the note above describes, harmless only
      # because nothing read it yet. Llama-3.3-70B for every role; the
      # evidence is the ADR-002 note of 2026-08-07.
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      # NFR-7 for the query path, the counterpart of the embedding budget above.
      LLM_CHAT_DAILY_CALL_BUDGET: ${LLM_CHAT_DAILY_CALL_BUDGET:-400}
      # Genuinely empty by nature: a secret with no sensible default. Empty
      # means the assistant cannot embed or answer, which is the correct
      # behaviour for a stack started without a key.
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      # Original uploaded documents. The database stores only the path
      # (domain-model.md: no BLOBs), so this volume is the documents.
      - protocol-files:/var/lib/maintenance/files
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # No ports: reachable only through caddy at /api/*.

  # ---------------------------------------------------------------------------
  # Keycloak in production mode: persistent Postgres storage, TLS terminated by
  # Caddy, hostname fixed so issued tokens carry the public URL.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: maintenance-keycloak
    restart: unless-stopped
    logging: *default-logging
    command: ["start", "--import-realm"]
    # --- MEMORY LIMIT — measured on the CX33, 2026-08-27 ----------------------
    # 686 MiB measured (`docker stats`). Same mechanism as the backend above: the
    # image's launcher sets -XX:MaxRAMPercentage=70 with InitialRAMPercentage=50
    # — read from /proc/1/cmdline — so today's ceiling is MaxHeapSize
    # 5,687,476,224 B = 5,424 MiB, sized against the host because no cgroup limit
    # exists to size against instead.
    #
    # 1280m, AND THE FIRST NUMBER WAS WRONG. At 1280 MiB the heap ceiling becomes
    # 896 MiB and about 380 MiB is left for metaspace, code cache, threads and
    # direct buffers — the things the percentage does NOT cover.
    #
    # 1024m was the arithmetic RSS + 256 MiB, and that formula is fine for a
    # process whose memory is its resident set. It is not fine for a JVM: the
    # limit it sets is the input to MaxRAMPercentage, so 1024 MiB would have
    # entitled the heap ALONE to 717 MiB and left roughly 300 MiB for everything
    # else in the process. Native memory does not fit in what the heap declines
    # to use, and the failure mode is not a slow container — it is an OOM kill on
    # the one service whose restart logs every user out.
    #
    # THE RULE THIS LEAVES BEHIND: size a JVM container from the heap ceiling the
    # percentage will produce, not from the resident set it happens to show. If
    # `docker inspect maintenance-keycloak --format '{{.State.OOMKilled}}'` ever
    # returns true, THIS number is the one to raise — 1536m next — and not the
    # JVM percentage, which belongs to the image and would drift on an upgrade.
    deploy:
      resources:
        limits:
          memory: 1280m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Full public URL. Without it Keycloak derives the issuer from the request
      # and tokens end up claiming an internal hostname the browser never used.
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      # TLS ends at Caddy, so Keycloak speaks plain HTTP on the internal network
      # and trusts the X-Forwarded-* headers Caddy sets.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Read by the login theme's theme.properties: where "Zurück zur Startseite" goes. The public
      # app host, which is the one thing about this link that differs between environments.
      WA_HOME_URL: https://${APP_DOMAIN}
      # The demo-account box on the login page. On because this deployment IS the public demo and
      # the credentials are published by decision — a working demo login is the point of the site.
      # Any deployment that is not a demo leaves this off and the box does not render.
      WA_SHOW_DEMO_ACCOUNTS: "true"
    volumes:
      # Imported only when the realm does not already exist, so an admin-console
      # change is not silently reverted on the next restart.
      #
      # NOTE, and it is why the runbook has a step 4: because the realm already exists here, the
      # `loginTheme` now set in this file will NOT be applied on import. It has to be selected once
      # in the admin console. The export carries it so a rebuilt realm is correct from the start.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # The login theme. A DIRECTORY mount, so a new file inside it needs no compose change, and it
      # does not carry OPS RULE 3's inode trap the way the single-file mounts in this stack do.
      #
      # Theme caching stays ON here — this is `start`, not `start-dev`. That is correct for
      # production (templates and CSS are read once instead of per request) and it is exactly why a
      # theme change is not live until `up -d --force-recreate keycloak`.
      - ./keycloak/themes/wartungsassistent:/opt/keycloak/themes/wartungsassistent:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships no curl or wget, so the check speaks HTTP over bash's /dev/tcp.
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # No ports: reachable only through caddy on the auth hostname.

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector. Holds both the application schema and Keycloak's.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: maintenance-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      # Consumed by the init script, which runs once on an empty data directory.
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No ports: one database serving two services on the compose network.

volumes:
  postgres-data:
  protocol-files:
  caddy-data:
  caddy-config:
