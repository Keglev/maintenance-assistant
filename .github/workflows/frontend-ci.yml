name: frontend-ci

# Runs on every pull request touching the frontend, and on main after merge.
# Coverage and Compodoc are uploaded only from main, because docs.yml publishes
# those artifacts to gh-pages and a pull request must not be able to publish.
#
# SINCE 2026-11-13 IT CAN ALSO FAIL ON THE E2E SUITE. frontend-e2e.yml runs as a
# job of this workflow behind a relevance gate (.github/scripts/e2e-relevant.sh),
# and the aggregator at the bottom — the job that carries the required check name —
# fails when the suite fails and passes when the gate skipped it. That is also what
# gates the deploy: frontend-deploy triggers on this workflow's conclusion, which
# now includes the suite. ADR-007's dated revision records the promotion.
on:
  pull_request:
    branches: [main]
    # NO PATH FILTER, deliberately: a workflow skipped by a path filter never
    # reports its required check and the PR can never merge. Every claimant runs
    # on every pull request; the `changes` job below decides from the diff
    # whether the frontend family is touched, and the aggregator passes a family
    # the change never touched. The partition lives in claimant-gate.sh.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      # No markdown file is built, tested or shipped, so a README edit must not
      # publish and roll out a new image. Pull requests still run every check.
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels the older run: only the head is
  # merged. On main every commit gets a group of its own instead, so a fast
  # second merge never cancels the first one's CI and, through it, its deploy.
  group: frontend-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Does this pull request touch this claimant's family at all? On a push the
  # trigger's path filters already decided and the gate answers true.
  changes:
    uses: ./.github/workflows/claimant-gate.yml
    with:
      family: frontend

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # BEFORE the tests on purpose: this is the cheapest check in the job and the one
      # whose failure is fixed by a single command (`npm run format`), so a formatting
      # slip should not cost a full vitest run first. Prettier was a devDependency with
      # a .prettierrc and no script and no step from the start of the project until
      # 2026-08-25 — configured, installed, and never run. The formatting findings the
      # Part 1 survey raised on the moderation view stayed open that whole time because
      # nothing could have caught them.
      - name: Check formatting
        run: npm run format:check

      # vitest in jsdom — no browser, so the runner needs no Chrome and no setup step.
      - name: Test with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Generate API documentation
        run: npm run docs

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/maintenance-assistant-frontend
          if-no-files-found: error
          retention-days: 7

      - name: Upload API documentation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-api-docs
          path: frontend/documentation
          if-no-files-found: error
          retention-days: 7

  # Decides whether this change can affect the rendered suites. Full history,
  # because the script diffs against the merge base.
  e2e-gate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          # On a pull request, the PR's own base and head; on a push to main, the
          # commits the push moved between.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/e2e-relevant.sh "$BASE" "$HEAD"

  e2e:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    uses: ./.github/workflows/frontend-e2e.yml

  # Same gate, same skip rule: a change that cannot affect the rendered suites
  # skips both of them.
  visual:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    uses: ./.github/workflows/frontend-e2e-visual.yml

  # The job id IS the status-check name: one required check per family, and this
  # is the frontend family's (the ruleset requires build-and-test-backend,
  # -frontend and -docs). if: always(), because a skipped aggregator REPORTS
  # SUCCESS to branch protection — the one outcome this job exists to prevent.
  # The verdict itself lives in aggregate-required-check.sh, shared by all
  # three claimants.
  # Builds the frontend image on every run of the family (never pushed from
  # here), writes its SBOM and gates on fixable CRITICAL/HIGH CVEs; see
  # image-scan.sh. No secrets are used in this job.
  image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          push: false
          tags: frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image contract (before the scan): the nginx configuration is valid
      # and the container does not run as root. The security headers are set by
      # Caddy, not here; frontend-deploy checks them at the public URL.
      - name: Check the nginx image contract
        run: |
          docker run --rm --entrypoint nginx frontend:ci -t
          uid=$(docker run --rm --entrypoint id frontend:ci -u)
          [ "$uid" != 0 ] || { echo "::error::the frontend image runs as root"; exit 1; }
      - name: Scan the image
        run: bash .github/scripts/image-scan.sh frontend:ci "$RUNNER_TEMP/frontend-sbom.cdx.json"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

  build-and-test-frontend:
    needs: [changes, build, image, e2e-gate, e2e, visual]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Aggregate the gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_RUN: ${{ needs.changes.outputs.run }}
          BUILD_RESULT: ${{ needs.build.result }}
          REQUIRED_RESULTS: image=${{ needs.image.result }}
          OPTIONAL_RESULTS: >-
            e2e-gate=${{ needs.e2e-gate.result }}
            e2e=${{ needs.e2e.result }}
            visual=${{ needs.visual.result }}
        run: bash .github/scripts/aggregate-required-check.sh
