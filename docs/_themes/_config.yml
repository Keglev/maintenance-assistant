# Jekyll configuration for the documentation site (GitHub Pages, gh-pages branch).
#
# Deliberately minimal: a remote theme, no custom CSS, no plugins beyond what GitHub
# Pages whitelists. This file is not active where it sits — the Phase 4 docs workflow
# copies docs/_themes/_config.yml and docs/_themes/_layouts/ to the site root next to
# the markdown. See README.md in this directory.

title: maintenance-assistant
description: >-
  AI assistant that makes maintenance protocols searchable in natural language,
  with citations and role-correct answers. EU-only data processing.
lang: en

remote_theme: just-the-docs/just-the-docs

# Rendered as-is from the repository markdown; relative links between docs keep working.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# just-the-docs options
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Repository on GitHub":
    - "https://github.com/Keglev/maintenance-assistant"
aux_links_new_tab: true

footer_content: >-
  Documentation for maintenance-assistant · arc42 + ADRs · status: in development, Phase 1

# Mermaid sources are pre-rendered to SVG by docs/scripts/generate-diagrams.mjs before
# the site is built, so no client-side diagram renderer is configured here.

exclude:
  - scripts/
  - "**/*.mmd"
  - DECISIONS.txt
  - PROJECT-PHASES.txt
