name: docs

# Publishes everything that lives on gh-pages, from two independent triggers:
#
#   a) push to main under docs/**  -> regenerate mermaid diagrams, build the
#      site with Pandoc, publish it at the root of gh-pages
#   b) frontend-ci / backend-ci succeeded on main -> publish their coverage and
#      API documentation into subfolders
#
# TWO publish steps are declared below and EXACTLY ONE RUNS PER RUN (I4), because
# the two jobs are mutually exclusive on event name. NEITHER SETS keep_files.
#
# keep_files WAS THE OLD ANSWER AND IT MADE THE SITE APPEND-ONLY. Four publish
# steps each preserved what the others wrote, which also preserved everything
# nobody wrote any more: a rename added a page and never removed the old one. By
# 2026-08-26 the branch was still serving a complete 2026-08-05 Jekyll build —
# 33 arc42 pages, six ADR sources and a just-the-docs theme — three weeks after
# the Pandoc site replaced it, all of it answering 200 and reachable from nothing.
#
# THE SITE JOB CARRIES THE REPORT SUBTREES OVER FROM gh-pages INSTEAD. That is
# what makes keep_files unnecessary: the published site is assembled in full
# before it is published, so "replace everything" is safe and deletion works.
#
# THE INVARIANTS, in the order they are enforced below:
#   I1  The site publish never deletes a report subtree — it checks gh-pages out
#       and copies backend/ and frontend/ into the build output first.
#   I2  A report publish never touches the site or the other project. It sets
#       destination_dir, and the action deletes only inside it: "existing files
#       in the publish branch (or only in `destination_dir` if given) will be
#       removed" — peaceiris/actions-gh-pages README, at the pinned commit.
#   I3  Anything at the root the site build did not produce is deleted on the
#       next site publish. This is the point of the change, not a side effect;
#       .nojekyll therefore comes from build-docs.sh now.
#   I4  Exactly one publish step runs per workflow run.
#   I5  A run that cannot find the report subtrees to carry over FAILS rather
#       than publishing a site without them. The one exception is a first-ever
#       publish, where gh-pages does not exist at all — see that step.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: [frontend-ci, backend-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write # pushes to the gh-pages branch
  actions: read # downloads artifacts from the triggering CI run

# Serialized, NOT cancelled: every job here pushes to the same gh-pages branch.
# Cancelling a run in flight would silently drop a published report, and two
# concurrent pushes would collide on a non-fast-forward.
#
# THIS IS NOW LOAD-BEARING FOR I1, not merely tidy. The site job READS gh-pages
# and then REPLACES it; a reports job publishing in between would write a subtree
# that the site job has already read and is about to overwrite with the older
# copy. Serialising the group is what closes that window. Do not add
# cancel-in-progress here, and do not give either job a group of its own.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # a) The documentation site itself
  # ---------------------------------------------------------------------------
  site:
    name: build and publish site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # From pandoc's own release and PINNED — the publishing half of the pair with
      # docs-pr-check.yml, and the reasoning lives there: a 2026-08-19 run stalled ~14 minutes in
      # `apt-get install pandoc` against an Ubuntu mirror. This is the workflow that actually
      # publishes, so a stall here means the site silently does not update.
      #
      # PIN — BUMP THIS DELIBERATELY, and in step with docs-pr-check.yml. The two must install the
      # same pandoc or the gate stops predicting what the publish produces.
      - name: Install Pandoc
        env:
          PANDOC_VERSION: '3.1.3'
        run: |
          curl -fsSL --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 5 \
            -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      # .mmd sources are versioned, the rendered SVGs are not; they are produced
      # here so the published site always matches the current diagram sources.
      - name: Render mermaid diagrams
        run: node docs/scripts/generate-diagrams.mjs

      # The build is a script, not inline YAML, so the same command produces the
      # same site on a laptop, in this job, and in the pull-request gate.
      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      # I1. The site build produces no reports — they come from the CI runs that
      # generate them — so the currently published copies are read back and folded
      # into the output before anything is published.
      #
      # continue-on-error IS THE FIRST-PUBLISH ESCAPE, and the only one: on a
      # repository where gh-pages does not exist yet this checkout fails, the step
      # below sees outcome != success, says so, and lets an empty site through.
      # Every other failure — a branch that exists without backend/ or frontend/ —
      # is caught by the guard and stops the run (I5).
      - name: Check out the published site
        id: published
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      # EXACTLY TWO DIRECTORIES ARE CARRIED. Everything else on gh-pages is either
      # something this build just produced or something nothing produces any more,
      # and the second kind is what I3 exists to remove.
      - name: Carry the report subtrees over
        run: |
          set -euo pipefail
          if [ "${{ steps.published.outcome }}" != "success" ]; then
            echo "::notice::gh-pages does not exist yet — first publish, nothing to carry over."
            exit 0
          fi
          missing=0
          for subtree in backend frontend; do
            if [ -d "gh-pages/$subtree" ]; then
              cp -r "gh-pages/$subtree" target/docs/
              echo "carried over: $subtree ($(find "target/docs/$subtree" -type f | wc -l) files)"
            else
              echo "::error::gh-pages/$subtree is missing. Publishing now would delete the"
              echo "::error::published $subtree reports, and this job cannot rebuild them."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # No keep_files and no destination_dir: the branch becomes this directory.
      # That is only safe because the step above put the reports back into it.
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/docs
          publish_branch: gh-pages
          commit_message: 'docs: publish site for ${{ github.sha }}'

  # ---------------------------------------------------------------------------
  # b) Coverage and API documentation from a successful CI run
  # ---------------------------------------------------------------------------
  reports:
    name: publish ${{ github.event.workflow_run.name }} reports
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # The OpenAPI render needs the build script, so the repository is checked
      # out here as well as in the site job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Identify the source project
        id: project
        run: |
          case "${{ github.event.workflow_run.name }}" in
            frontend-ci) echo "name=frontend" >> "$GITHUB_OUTPUT" ;;
            backend-ci)  echo "name=backend"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected workflow: ${{ github.event.workflow_run.name }}" >&2; exit 1 ;;
          esac

      # Artifacts live on the CI run, not on this one, so the run id is explicit.
      # CI uploads them only from main, so pull requests can never publish.
      # The paths match what build-openapi-docs.sh looks for.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.project.outputs.name }}-coverage
          path: target/reports/${{ steps.project.outputs.name }}-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download API documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.project.outputs.name }}-api-docs
          path: target/reports/${{ steps.project.outputs.name }}-api-docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The backend artifact is a raw OpenAPI document, which is not something a
      # reviewer reads. Redocly renders it through the same script the site build
      # calls, so the published page cannot drift from a local build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.project.outputs.name == 'backend'
        with:
          node-version: 22

      - name: Render the OpenAPI reference
        if: steps.project.outputs.name == 'backend'
        run: bash .github/scripts/docs/build-openapi-docs.sh .

      # Every published surface carries the same way back to the documentation
      # site. These three are generated by tools that own their whole page —
      # JaCoCo, istanbul, Compodoc — so a reader who follows a link into one has
      # no route back except editing the URL. The Redocly page gets the identical
      # anchor from the same script, one step above.
      #
      # AFTER the download and BEFORE the staging step, because that step copies
      # these directories exactly as they stand.
      - name: Inject the back-to-docs anchor into the coverage report
        run: |
          bash .github/scripts/docs/inject-back-to-docs.sh \
            "target/reports/${{ steps.project.outputs.name }}-coverage/index.html"

      - name: Inject the back-to-docs anchor into the Compodoc reference
        if: steps.project.outputs.name == 'frontend'
        run: |
          bash .github/scripts/docs/inject-back-to-docs.sh \
            target/reports/frontend-api-docs/index.html

      # ONE SUBTREE, ASSEMBLED WHOLE, so one publish can replace it. Backend takes
      # the Redocly page the step above rendered; frontend takes the Compodoc tree
      # its artifact already contains. Both take their coverage from the artifact.
      - name: Stage the report subtree
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "target/publish/$NAME"
          cp -r "target/reports/$NAME-coverage" "target/publish/$NAME/coverage"
          if [ "$NAME" = "backend" ]; then
            cp -r target/docs/backend/api-docs "target/publish/$NAME/api-docs"
          else
            cp -r target/reports/frontend-api-docs "target/publish/$NAME/api-docs"
          fi
          echo "staged $NAME: $(find "target/publish/$NAME" -type f | wc -l) files"
          find "target/publish/$NAME" -maxdepth 1 -mindepth 1 -type d | sort

      # I2. destination_dir scopes the deletion to this project's subtree, so the
      # site at the root and the other project's reports cannot be touched — see
      # the README quotation in the header. A page that stops being generated is
      # now removed rather than kept forever: the first run of this deletes two
      # JaCoCo pages for a class that no longer exists.
      - name: Publish ${{ steps.project.outputs.name }} reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/publish/${{ steps.project.outputs.name }}
          publish_branch: gh-pages
          destination_dir: ${{ steps.project.outputs.name }}
          commit_message: 'docs: publish ${{ steps.project.outputs.name }} coverage and API reference'
