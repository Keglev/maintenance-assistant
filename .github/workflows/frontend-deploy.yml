name: frontend-deploy

# Publishes the frontend image to GHCR after frontend-ci succeeded on main, then
# rolls it out to the Hetzner host. See backend-deploy.yml for why this uses
# workflow_run rather than `on: push`.
#
# workflow_dispatch redeploys whatever tag .env.prod currently names, without a
# code change.
on:
  workflow_run:
    workflows: [frontend-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Build-side only; the deploy job carries the shared rollout group.
  group: frontend-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and push image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # See backend-deploy.yml: checkout v7 blocks fork-PR code under workflow_run,
      # which is the behaviour this job wants before it pushes an image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          # amd64 only — and this is the leg that actually broke: `npm ci` under qemu-emulated
          # arm64 died with "uncaught target signal 4 (Illegal instruction)" after 13 minutes on
          # 2026-08-10. Node under qemu is a known failure mode, and the image it was building had
          # no consumer. See DECISIONS.txt == COSTS & OPERATIONS ==.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Rollout. Separate from the build so the serialisation below covers only the
  # part that touches the server.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy to Hetzner
    needs: image
    runs-on: ubuntu-latest

    # Shared with backend-deploy on purpose: both run `docker compose up` against
    # the same host, and two of those at once race over the same containers and
    # the same Docker daemon. cancel-in-progress is false because a cancelled
    # rollout leaves the stack half-updated.
    concurrency:
      group: hetzner-deploy
      cancel-in-progress: false

    env:
      # Public URL, so it is not a secret and stays readable in the log.
      APP_URL: https://maintenance.smartsupply.com.de/

    steps:
      # The key is written from a secret through the environment rather than
      # interpolated into the script, so it never becomes part of the command
      # line. `set -x` is deliberately absent from every step in this job.
      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust on first use — see the same step in backend-deploy.yml.
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart the frontend service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu
             cd /opt/maintenance-assistant
             COMPOSE="docker compose -f /opt/maintenance-assistant/docker-compose.prod.yml --env-file /opt/maintenance-assistant/.env.prod"
             $COMPOSE pull frontend
             $COMPOSE up -d frontend
             docker image prune -f >/dev/null'

      # Checked from the runner over the public internet: that exercises DNS, TLS
      # and the reverse proxy as well as the container. The application is a SPA,
      # so a 200 on the root with the app shell in it is the available signal —
      # there is no server-rendered health endpoint to ask.
      - name: Verify the deployed frontend is serving
        run: |
          set -eu
          for attempt in $(seq 1 20); do
            code=$(curl -fsS -o /tmp/index.html -w '%{http_code}' --max-time 10 "$APP_URL" 2>/dev/null || true)
            if [ "$code" = "200" ] && grep -q '<app-root' /tmp/index.html; then
              echo "serving the application shell after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-none}, shell not found yet"
            sleep 6
          done
          echo "::error::Frontend did not serve the application shell at ${APP_URL} after 20 attempts"
          exit 1

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
