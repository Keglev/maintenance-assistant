name: backend-ci

# Runs on every pull request touching the backend, and on main after merge.
# `mvn verify` covers unit tests, integration tests, the JaCoCo report and the
# OpenAPI export — no database or Keycloak is needed, because the test profile
# disables datasource and Flyway auto-configuration and no token is validated.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: error
          retention-days: 7

      # The OpenAPI document written by OpenApiSpecIT. Published to gh-pages by
      # docs.yml, because reachable API docs are a hard requirement for the demo.
      - name: Upload OpenAPI spec
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-docs
          path: backend/target/openapi
          if-no-files-found: error
          retention-days: 7

      # Test reports are useful precisely when the build is red.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
