server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page application: every unknown path is a client-side
    # route, not a 404. /login and /home must survive a browser reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle references.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # theme-init.js is the one script that is NOT content-hashed: it ships from public/ so that
    # index.html can name it, which is exactly what the rule above assumes never happens. Left to
    # that rule it would be pinned in every returning visitor's cache for a year, and a fix to it
    # would reach nobody. An exact-match location beats the regex above in nginx.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
    }

    # The backend is reached through the reverse proxy in front of this container
    # (Phase 4). Nothing is proxied here, so the image stays environment-agnostic.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
