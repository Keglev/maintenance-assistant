# Dependabot — the half of the SHA-pinning decision that keeps the pins current.
#
# Every external action in this repository is pinned to a full commit SHA (C16,
# ruled 2026-08-25). A pin is a snapshot: it removes the risk that a mutable tag
# is repointed under us, and it adds the risk that a security fix published
# upstream never arrives. This file is what makes the second risk survivable —
# pinned AND watched, rather than pinned and frozen.
#
# MONTHLY, NOT WEEKLY OR DAILY. Carlos reviews every pull request in this
# repository personally, so the cost of an update is a review, not a merge
# button. One batch a month is a session; a trickle is an interruption, and an
# interruption is what turns dependency PRs into a queue nobody reads. Grouped
# for the same reason: one pull request per ecosystem, not one per package.
#
# DEPENDABOT PULL REQUESTS GO THROUGH THE SAME REQUIRED CHECKS as any other —
# they report under `build-and-test` from whichever workflow owns their paths,
# and a bumped action that breaks the docs build or the backend suite is red
# before it is mergeable. Nothing here is auto-merged.
#
# NO IGNORE RULES, deliberately. An ignored dependency is a decision that
# disappears; if something must not be updated, that belongs in a ledger entry
# where it can be revisited, not in a config file nobody re-reads.
version: 2

updates:
  # The actions this repository pins. Two of them are third-party — peaceiris
  # and lycheeverse — and one of those holds `contents: write` on gh-pages,
  # which is the strongest argument in the file for watching this ecosystem.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
    # No labels. The repository carries only GitHub's default set, none of which
    # fits a dependency bump, and Dependabot creates a `dependencies` label of
    # its own when this key is absent. An empty list means it labels nothing and
    # creates nothing.
    labels: []

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns:
          - '*'
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
    labels: []

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns:
          - '*'
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
    labels: []
