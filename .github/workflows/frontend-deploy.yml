name: frontend-deploy

# =============================================================================
# frontend-deploy.yml - Deploys the frontend after frontend-ci succeeded on main.
#
# Usage: starts by itself when frontend-ci completes on main (workflow_run), or by
# hand (workflow_dispatch) to redeploy whatever tag .env.prod names, without a
# code change. backend-deploy.yml says why the trigger is workflow_run.
#
# Produces: what deploy-tier.yml produces for the frontend; this file decides only
# when.
#
# FAILURE MODE: skipped when frontend-ci failed or was cancelled; otherwise red or
# green as deploy-tier.yml describes. The live commit is read from
# /build-info.json; the application shell and the security headers set by Caddy
# are checked at the public URL as well.
# =============================================================================

on:
  workflow_run:
    workflows: [frontend-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Only a successful CI run on a push to main of this repository deploys: the
    # branches filter matches a branch NAME, which a fork can share. A manual
    # dispatch has no workflow_run to inspect and is admitted on the event name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/deploy-tier.yml
    with:
      tier: frontend
      commit-url: https://maintenance.smartsupply.com.de/build-info.json
      app-url: https://maintenance.smartsupply.com.de/
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
